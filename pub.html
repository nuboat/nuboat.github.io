		<script>

				document.documentElement.setAttribute('data-theme', savedTheme);
			} else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
				document.documentElement.setAttribute('data-theme', 'dark');
			}

		<style>

				padding: 1.25rem 1rem 2.5rem;

				display: flex;

			}

				padding: 0.35rem 0.75rem;

				border: 1px solid var(--ci-line);
				box-shadow: var(--ci-shadow);
				font-size: 0.9rem;
				transition: all 0.2s ease;
			}
			.pub-nav-back:hover {
				color: var(--ci-cyan) !important;

			}
			.pub-nav-btn {
				width: 36px;
				height: 36px;
				border-radius: 999px;
				background: var(--ci-paper);
				border: 1px solid var(--ci-line);
				color: var(--ci-headline);
				display: inline-flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				box-shadow: var(--ci-shadow);
				transition: all 0.2s ease;
			}
			.pub-nav-btn:hover {
				color: var(--ci-cyan);
				border-color: var(--ci-cyan);
			}
			.pub-card {
				background: var(--ci-paper);
				border: 1px solid var(--ci-line);
				border-radius: 16px;
				box-shadow: var(--ci-shadow);
				padding: 1.4rem;
				margin-bottom: 1.25rem;
				text-align: center;
			}
			.pub-card-title {
				font-family: var(--ci-display);
				font-size: 1.1rem;
				font-weight: 600;
				color: var(--ci-headline);
				margin-bottom: 0.8rem;
				display: flex;
				align-items: center;
				justify-content: flex-start;
				gap: 0.5rem;
			}
			.pub-key-box {
				text-align: left;
				position: relative;
			}
			.pub-key-box pre {
				margin: 0;
				background: var(--ci-canvas);
				border: 1px solid var(--ci-line);
				border-radius: 8px;
				padding: 0.9rem;
			}
			.pub-key-box code {
				font-size: 0.68rem;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				background: transparent !important;
				border: none !important;
				padding: 0;
			}
			.copy-key-btn {
				margin-top: 0.6rem;
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				font-size: 0.8rem;
				font-weight: 600;
				padding: 0.4rem 0.8rem;
				border-radius: 6px;
				background: var(--ci-canvas);
				border: 1px solid var(--ci-line);
				color: var(--ci-headline);
				cursor: pointer;
				transition: all 0.2s ease;
			}
			.copy-key-btn:hover {
				border-color: var(--ci-cyan);
				color: var(--ci-cyan);
			}
			.pub-footer {
				margin-top: 2rem;
				text-align: center;
				font-size: 0.85rem;
				color: var(--ci-muted);
			}
			.pub-footer-links {
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 0.75rem;
				margin-bottom: 0.5rem;
				flex-wrap: wrap;
			}
			.pub-footer-links a {
				color: var(--ci-headline);
				font-weight: 500;
				border-bottom: none;
			}
			.pub-footer-links a:hover {
				color: var(--ci-cyan) !important;
			}
			.toast-message {
				position: fixed;
				bottom: 24px;
				left: 50%;
				transform: translateX(-50%) translateY(100px);
				background: var(--ci-navy);
				color: #fff;
				padding: 0.6rem 1.2rem;
				border-radius: 999px;
				font-size: 0.85rem;
				font-weight: 500;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
				z-index: 10001;
				opacity: 0;
				pointer-events: none;
				transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.3s ease;
			}
			[data-theme="dark"] .toast-message {
				background: var(--ci-cyan);
				color: #00162e;
			}
			.toast-message.show {
				transform: translateX(-50%) translateY(0);
				opacity: 1;
			}
		</style>

	<body class="is-preload">
		<div class="pub-page-container">
			<div>
				<!-- Top Navigation Header -->
				<header class="pub-top-nav">
					<a href="index.html" class="pub-nav-back">
						<i class="fa fa-arrow-left" aria-hidden="true"></i>
						<span>Home</span>
					</a>
					<button type="button" id="theme-toggle" class="pub-nav-btn fa fa-moon" title="Toggle theme" aria-label="Toggle theme"></button>
				</header>

				<!-- SSH Public Key Card -->
				<section class="pub-card pub-key-box" aria-label="ECDSA Public Key">
					<h2 class="pub-card-title" style="justify-content: flex-start;">
						<i class="fa fa-key" aria-hidden="true"></i>
						<span>id_ecdsa.pub</span>
					</h2>
					<pre><code id="ecdsa-key">ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBAxnfyhrGGRdmWje3wsEJwkQc869rzIlp3ayX10DBd6H9TiTFb40ZEbovSzKx94xryeG+QmkyF/pnbNLfTH3PeY</code></pre>
					<button type="button" id="copy-key-btn" class="copy-key-btn">
						<i class="fa fa-copy" aria-hidden="true"></i>
						<span>Copy Public Key</span>
					</button>
				</section>
			</div>

			<!-- Footer -->
			<footer class="pub-footer">
				<div class="pub-footer-links">
					<a href="index.html">Home</a>
					<span>&bull;</span>
					<a href="profile.html">Resume</a>
					<span>&bull;</span>
					<a href="vcard.html">vCard</a>
					<span>&bull;</span>
					<a href="promptpay.html">PromptPay</a>
					<span>&bull;</span>
					<a href="policy.html">Privacy</a>
				</div>

					&copy; 2021 - 2026, Peerapat Asoktummarungsri
				</p>
			</footer>
		</div>

		<!-- Toast Message -->
		<div id="toast-message" class="toast-message" role="status" aria-live="polite">
			<span id="toast-text">Copied to clipboard!</span>
		</div>

		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
		<script src="./assets/js/cookie-consent.js"></script>
		<script>
			// Toast helper
			function showToast(msg) {
				const toast = document.getElementById('toast-message');
				const text = document.getElementById('toast-text');
				if (!toast || !text) return;
				text.textContent = msg;
				toast.classList.add('show');
				setTimeout(() => {
					toast.classList.remove('show');
				}, 2200);
			}

			// Copy key helper
			const copyKeyBtn = document.getElementById('copy-key-btn');
			if (copyKeyBtn) {
				copyKeyBtn.addEventListener('click', async () => {
					const code = document.getElementById('ecdsa-key');
					if (!code) return;
					const str = code.textContent.trim();
					try {
						if (navigator.clipboard && window.isSecureContext) {
							await navigator.clipboard.writeText(str);
						} else {
							const ta = document.createElement('textarea');
							ta.value = str;
							document.body.appendChild(ta);
							ta.select();
							document.execCommand('copy');
							document.body.removeChild(ta);
						}
						showToast('Public key copied to clipboard!');
					} catch (e) {
						showToast('Failed to copy');
					}
				});
			}

			// Theme toggle logic
			const themeToggle = document.getElementById('theme-toggle');
			if (themeToggle) {
				const updateIcon = () => {
					if (document.documentElement.getAttribute('data-theme') === 'dark') {
						themeToggle.classList.remove('fa-moon');
						themeToggle.classList.add('fa-sun');
					} else {
						themeToggle.classList.remove('fa-sun');
						themeToggle.classList.add('fa-moon');
					}
				};
				updateIcon();

				themeToggle.addEventListener('click', () => {
					const currentTheme = document.documentElement.getAttribute('data-theme');
					const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
					document.documentElement.setAttribute('data-theme', newTheme);
					localStorage.setItem('theme', newTheme);
					updateIcon();
				});
			}
		</script>
	</body>
</html>
