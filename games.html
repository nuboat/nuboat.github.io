			/* Premium Gallery Styles */
			.gallery-container {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(135px, 187px));
				justify-content: center;
				gap: 1.5rem;
				padding: 2rem 0;

			.gallery-item {
				position: relative;
				border-radius: 16px;
				overflow: hidden;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
				transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, opacity 0.3s ease;

				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				border: 1px solid rgba(255, 255, 255, 0.1);
				cursor: pointer;
			}

			.gallery-item:hover,
			.gallery-item:focus-visible {
				transform: translateY(-8px) scale(1.03);
				box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
				z-index: 2;
				outline: none;
			}
			.gallery-item:focus-visible {
				box-shadow: 0 0 0 3px var(--ci-cyan, #05ACE1), 0 20px 40px rgba(0, 0, 0, 0.15);
			}
			.gallery-item img {
				width: 100%;
				height: auto;
				display: block;
				transition: transform 0.5s ease;
			}
			.gallery-item:hover img,
			.gallery-item:focus-visible img {
				transform: scale(1.08);
			}

			.gallery-item.hidden {
				display: none;
			}

			/* Filter Bar */
			.filter-bar {
				display: flex;
				justify-content: center;
				gap: 0.5rem;
				flex-wrap: wrap;
				margin-top: 1.25rem;
				padding: 0 1rem;
			}
			.filter-btn {
				background: var(--ci-paper, #ffffff);
				border: 1px solid var(--ci-line, #e3e8ee);
				color: var(--ci-muted, #5c6b7a);
				padding: 0.45rem 1.1rem;
				border-radius: 99px;
				font-size: 0.85rem;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.25s ease;
				box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
				font-family: inherit;
				text-decoration: none;
			}
			.filter-btn:hover {
				color: var(--ci-navy, #002856);
				border-color: var(--ci-cyan, #05ACE1);
				transform: translateY(-1px);
			}
			.filter-btn.active {
				background: var(--ci-blue, #006098);
				color: #ffffff;
				border-color: var(--ci-blue, #006098);
				box-shadow: 0 4px 14px rgba(0, 96, 152, 0.25);
			}
			[data-theme="dark"] .filter-btn {
				background: var(--ci-paper, #002856);
				border-color: var(--ci-line, #003d6b);
				color: var(--ci-muted, #919C7A);
			}
			[data-theme="dark"] .filter-btn:hover {
				color: var(--ci-sand, #F7D88E);
				border-color: var(--ci-cyan, #05ACE1);
			}
			[data-theme="dark"] .filter-btn.active {

				color: #00162e;
				border-color: var(--ci-cyan, #05ACE1);

			}

			/* Modal for viewing images */
			.gallery-modal {
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.85);
				backdrop-filter: blur(8px);
				z-index: 10000;
				align-items: center;
				justify-content: center;
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			.gallery-modal.active {
				display: flex;
				opacity: 1;
			}
			.gallery-modal img {
				max-width: 90%;
				max-height: 90vh;
				border-radius: 8px;
				box-shadow: 0 0 40px rgba(0,0,0,0.5);

				transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
				object-fit: contain;
			}
			.gallery-modal.active img {

			}
			.gallery-modal-close {

				top: 20px;
				right: 30px;
				color: white;
				font-size: 2rem;
				cursor: pointer;
				transition: color 0.2s ease;

			}

		<script>
			// Modal logic
			const modal = document.getElementById('galleryModal');
			const modalImg = document.getElementById('modalImage');

			function openModal(imgSrc, imgAlt) {
				modalImg.src = imgSrc;
				modalImg.alt = imgAlt || 'Expanded Game Cover';
				modal.style.display = 'flex';
				// Trigger reflow for transition
				void modal.offsetWidth;
				modal.classList.add('active');
				document.body.style.overflow = 'hidden';
			}

			function closeModal(e) {
				if (e) e.stopPropagation();
				modal.classList.remove('active');
				setTimeout(() => {
					modal.style.display = 'none';
					document.body.style.overflow = '';
					modalImg.src = '';
				}, 300);
			}
			
			// Close modal on escape key
			document.addEventListener('keydown', function(e) {
				if (e.key === 'Escape' && modal.classList.contains('active')) {
					closeModal();
				}
			});

			// Filter tab logic
			const filterButtons = document.querySelectorAll('.filter-btn');
			const galleryItems = document.querySelectorAll('.gallery-item');

			filterButtons.forEach(btn => {
				btn.addEventListener('click', () => {
					filterButtons.forEach(b => b.classList.remove('active'));
					btn.classList.add('active');
					const filter = btn.getAttribute('data-filter');

					galleryItems.forEach(item => {
						if (filter === 'all' || item.getAttribute('data-platform') === filter) {
							item.classList.remove('hidden');
						} else {
							item.classList.add('hidden');
						}
					});
				});
			});

			// Theme toggle logic
			const themeToggle = document.getElementById('theme-toggle');
			if (themeToggle) {
				const updateIcon = () => {
					if (document.documentElement.getAttribute('data-theme') === 'dark') {
						themeToggle.classList.remove('fa-moon');
						themeToggle.classList.add('fa-sun');
					} else {
						themeToggle.classList.remove('fa-sun');
						themeToggle.classList.add('fa-moon');
					}
				};
				updateIcon();
				themeToggle.addEventListener('click', () => {
					const currentTheme = document.documentElement.getAttribute('data-theme');
					const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
					document.documentElement.setAttribute('data-theme', newTheme);
					localStorage.setItem('theme', newTheme);
					updateIcon();
				});
			}
		</script>
