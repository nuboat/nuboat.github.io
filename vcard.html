			.vcard-page-wrapper {

			}
			.vcard-nav-controls {

				align-items: center;

				color: var(--ci-headline);

				transition: all 0.2s ease;

			/* Main Content Area */

				font-weight: 700;
				font-size: clamp(1.15rem, 1rem + 0.8vw, 1.35rem);
				color: var(--ci-headline);

				display: flex;
				align-items: center;

			}

			}
			[data-theme="dark"] .vcard-qr-header i {
				color: var(--ci-cyan);
			}

			/* High contrast quiet zone frame for reliable camera scanning */
			.vcard-qr-frame {
				background: #ffffff;
				padding: 1.1rem;
				border-radius: 16px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
				border: 2px solid var(--ci-line);
				display: inline-flex;
				align-items: center;
				justify-content: center;
				transition: transform 0.2s ease, box-shadow 0.2s ease;
				cursor: pointer;
				margin-bottom: 1.35rem;
			}
			.vcard-qr-frame:hover {
				transform: scale(1.02);
				box-shadow: 0 8px 26px rgba(5, 172, 225, 0.18);
			}
			.vcard-qr-frame img {

				width: 100%;
				max-width: 240px;

				height: auto;
				border-radius: 4px;

		<script>
			// Toast notification helper
			function showToast(msg) {
				const toast = document.getElementById('toast-message');
				const text = document.getElementById('toast-text');
				if (!toast || !text) return;
				text.textContent = msg;
				toast.classList.add('show');
				setTimeout(() => {
					toast.classList.remove('show');
				}, 2200);
			}

			// Copy text to clipboard helper
			async function copyToClipboard(text, successMsg) {
				try {
					if (navigator.clipboard && window.isSecureContext) {
						await navigator.clipboard.writeText(text);
					} else {
						const textArea = document.createElement('textarea');
						textArea.value = text;
						textArea.style.position = 'fixed';
						textArea.style.opacity = '0';
						document.body.appendChild(textArea);
						textArea.focus();
						textArea.select();
						document.execCommand('copy');
						document.body.removeChild(textArea);
					}
					showToast(successMsg || 'Copied to clipboard!');
				} catch (err) {
					console.error('Copy failed: ', err);
					showToast('Failed to copy');
				}
			}

			// Web Share API handler
			async function handleShare() {
				const shareData = {
					title: 'Peerapat Asoktummarungsri - UIH Contact vCard',
					text: 'Official UIH contact vCard QR code for Peerapat Asoktummarungsri (Peerapat Norbor).',
					url: window.location.href
				};
				if (navigator.share) {
					try {
						await navigator.share(shareData);
					} catch (err) {
						if (err.name !== 'AbortError') {
							copyToClipboard(window.location.href, 'Card link copied to clipboard!');
						}
					}
				} else {
					copyToClipboard(window.location.href, 'Card link copied to clipboard!');
				}
			}

			const shareBtn = document.getElementById('share-card-btn');
			if (shareBtn) shareBtn.addEventListener('click', handleShare);

			// Theme toggle logic
			const themeToggle = document.getElementById('theme-toggle');
			if (themeToggle) {
				const updateIcon = () => {
					if (document.documentElement.getAttribute('data-theme') === 'dark') {
						themeToggle.classList.remove('fa-moon');
						themeToggle.classList.add('fa-sun');
					} else {
						themeToggle.classList.remove('fa-sun');
						themeToggle.classList.add('fa-moon');
					}
				};
				updateIcon();

				themeToggle.addEventListener('click', () => {
					const currentTheme = document.documentElement.getAttribute('data-theme');
					const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
					document.documentElement.setAttribute('data-theme', newTheme);
					localStorage.setItem('theme', newTheme);
					updateIcon();
				});
			}
		</script>
