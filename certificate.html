		<script>
			// Modal logic
			const modal = document.getElementById('galleryModal');
			const modalBody = document.getElementById('modalBody');
			const modalOpen = document.getElementById('modalOpen');

			function openModal(src, type, title) {
				modalBody.replaceChildren();

				const node = document.createElement(type === 'pdf' ? 'iframe' : 'img');
				node.src = type === 'pdf' ? src + '#navpanes=0&view=Fit' : src;
				if (type === 'pdf') {
					node.title = title;
				} else {
					node.alt = title;
				}
				modalBody.appendChild(node);

				modalOpen.href = src;
				modal.showModal();
				document.body.style.overflow = 'hidden';
			}

			document.querySelectorAll('.gallery-item').forEach(item => {
				item.addEventListener('click', () => {
					openModal(item.dataset.src, item.dataset.type, item.dataset.title);
				});
			});

			document.getElementById('modalClose').addEventListener('click', () => modal.close());

			// showModal() handles Esc and focus trapping; clearing up happens here.
			modal.addEventListener('close', () => {
				modalBody.replaceChildren();
				document.body.style.overflow = '';
			});

			// Light-dismiss fallback for browsers without <dialog closedby> (Safari).
			if (!('closedBy' in HTMLDialogElement.prototype)) {
				modal.addEventListener('click', (event) => {
					if (event.target !== modal) return;
					const rect = modal.getBoundingClientRect();
					const insideContent =
						rect.top <= event.clientY && event.clientY <= rect.top + rect.height &&
						rect.left <= event.clientX && event.clientX <= rect.left + rect.width;
					if (insideContent) return;
					modal.close();
				});
				// The dialog fills the viewport here, so also treat a click on the
				// empty area of the flex wrapper as a backdrop click.
				modalBody.addEventListener('click', (event) => {
					if (event.target === modalBody) modal.close();
				});
			}
		</script>
		<script>
			// Theme toggle logic (Complies with profile.html reference)
			const themeToggle = document.getElementById('theme-toggle');
			if (themeToggle) {
				// Update icon based on current theme
				const updateIcon = () => {
					if (document.documentElement.getAttribute('data-theme') === 'dark') {
						themeToggle.classList.remove('fa-moon');
						themeToggle.classList.add('fa-sun');
					} else {
						themeToggle.classList.remove('fa-sun');
						themeToggle.classList.add('fa-moon');
					}
				};
				updateIcon();

				const toggleTheme = () => {
					const currentTheme = document.documentElement.getAttribute('data-theme');
					const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
					document.documentElement.setAttribute('data-theme', newTheme);
					localStorage.setItem('theme', newTheme);
					updateIcon();
				};

				themeToggle.addEventListener('click', toggleTheme);
				themeToggle.addEventListener('keydown', (e) => {
					if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
				});
			}
		</script>
	</body>
</html>
