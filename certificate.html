		<style>
			/* Premium Gallery Styles — certificate variant */
			.gallery-container {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(280px, 400px));
				justify-content: center;
				gap: 1.5rem;
				padding: 2rem 0;
			}
			.gallery-item {
				position: relative;
				display: flex;
				flex-direction: column;
				width: 100%;
				padding: 0;
				border-radius: 16px;
				overflow: hidden;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
				transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
				background: rgba(255, 255, 255, 0.05);
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				border: 1px solid rgba(255, 255, 255, 0.1);
				cursor: pointer;
				font: inherit;
				color: inherit;
				text-align: left;
				appearance: none;
				-webkit-appearance: none;
			}
			.gallery-item:hover,
			.gallery-item:focus-visible {
				transform: translateY(-8px) scale(1.03);
				box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
				z-index: 2;
			}
			.gallery-item:focus-visible {
				outline: 2px solid var(--ci-cyan);
				outline-offset: 3px;
			}

			/* Preview pane — certificates are documents, so contain them on paper
			   rather than cropping the name and title away with object-fit: cover. */
			.cert-preview {
				position: relative;
				display: block;
				aspect-ratio: 4 / 3;
				background: #ffffff;
				overflow: hidden;
			}
			.cert-preview img {
				position: absolute;
				inset: 0;
				display: block;
				width: 100%;
				height: 100%;
				border: 0;
				object-fit: contain;
				transition: transform 0.5s ease;
			}
			.gallery-item:hover .cert-preview img {
				transform: scale(1.06);
			}
			/* PDFs are previewed by a pre-rendered page-1 thumbnail rather than an
			   embedded viewer: an <img> paints immediately, looks the same in every
			   browser, and does not depend on a PDF plugin that iOS Safari lacks.
			   The tile still opens the real PDF. */
			.cert-badge {
				display: inline-flex;
				align-items: center;
				gap: 0.3rem;
				margin-left: 0.5rem;
				padding: 0.1rem 0.45rem;
				border-radius: 99px;
				border: 1px solid var(--ci-line);
				color: var(--ci-muted);
				font-family: var(--ci-display);
				font-size: 0.68rem;
				font-weight: 600;
				letter-spacing: 0.06em;
				vertical-align: 0.05em;
			}
			.cert-badge i { font-size: 0.9em; color: #b23b3b; }

			.cert-caption {
				display: block;
				padding: 0.9rem 1rem 1rem;
				background: var(--ci-paper);
				border-top: 1px solid var(--ci-line);
			}
			.cert-title {
				display: block;
				font-family: var(--ci-display);
				font-weight: 600;
				font-size: 0.92rem;
				line-height: 1.35;
				color: var(--ci-headline);
			}
			.cert-meta {
				display: block;
				margin-top: 0.25rem;
				white-space: nowrap;
				font-size: 0.78rem;
				color: var(--ci-muted);
			}

			/* Modal for viewing certificates */
			.gallery-modal {
				width: 100%;
				max-width: 100%;
				height: 100%;
				max-height: 100%;
				padding: 0;
				border: 0;
				background: transparent;
				overflow: hidden;
			}
			.gallery-modal::backdrop {
				background: rgba(0, 0, 0, 0.85);
				backdrop-filter: blur(8px);
				-webkit-backdrop-filter: blur(8px);
			}
			.gallery-modal-inner {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 100%;
				height: 100%;
			}
			.gallery-modal img,
			.gallery-modal iframe {
				width: 90%;
				max-width: 1100px;
				height: 90vh;
				border: 0;
				border-radius: 8px;
				box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
				background: #ffffff;
				transform: scale(0.95);
				transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			}
			.gallery-modal img {
				width: auto;
				max-height: 90vh;
				object-fit: contain;
				background: transparent;
			}
			.gallery-modal[open] img,
			.gallery-modal[open] iframe {
				transform: scale(1);
			}
			.gallery-modal-close {
				position: absolute;
				top: 20px;
				right: 30px;
				color: white;
				font-size: 2rem;
				line-height: 1;
				cursor: pointer;
				background: none;
				border: 0;
				padding: 0.25rem;
				transition: color 0.2s ease;
				z-index: 10001;
			}
			.gallery-modal-close:hover { color: #f56a6a; }
			.gallery-modal-open {
				position: absolute;
				top: 26px;
				left: 30px;
				color: rgba(255, 255, 255, 0.85);
				font-size: 0.85rem;
				z-index: 10001;
			}
			.gallery-modal-open:hover { color: #ffffff !important; }

			@media screen and (max-width: 736px) {
				.gallery-modal img,
				.gallery-modal iframe { width: 100%; height: 78vh; }
				.gallery-modal-open { top: auto; bottom: 20px; left: 20px; }
			}

			@media (prefers-reduced-motion: reduce) {
				.gallery-item,
				.cert-preview img,
				.gallery-modal img,
				.gallery-modal iframe { transition: none; }
				.gallery-item:hover,
				.gallery-item:focus-visible { transform: none; }
			}

			#theme-toggle {
				position: absolute;
				top: 1.5rem;
				right: 1.5rem;
				cursor: pointer;
				border-bottom: none;
				font-size: 1.2em;
			}
		</style>
		<script>
			// Dark mode init
			const savedTheme = localStorage.getItem('theme');
			if (savedTheme) {
				document.documentElement.setAttribute('data-theme', savedTheme);
			} else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
				document.documentElement.setAttribute('data-theme', 'dark');
			}
		</script>
	</head>

		<!-- Certificate Modal -->
		<dialog class="gallery-modal" id="galleryModal" closedby="any" aria-label="Certificate viewer">
			<a class="gallery-modal-open" id="modalOpen" href="#" target="_blank" rel="noopener">

		<script src="./assets/js/jquery.min.js"></script>

		<script src="./assets/js/cookie-consent.js"></script>
		<script>
			// Modal logic
			const modal = document.getElementById('galleryModal');
			const modalBody = document.getElementById('modalBody');
			const modalOpen = document.getElementById('modalOpen');

			function openModal(src, type, title) {
				modalBody.replaceChildren();

				const node = document.createElement(type === 'pdf' ? 'iframe' : 'img');
				node.src = type === 'pdf' ? src + '#navpanes=0&view=Fit' : src;
				if (type === 'pdf') {
					node.title = title;
				} else {
					node.alt = title;
				}
				modalBody.appendChild(node);

				modalOpen.href = src;
				modal.showModal();
				document.body.style.overflow = 'hidden';
			}

			document.querySelectorAll('.gallery-item').forEach(item => {
				item.addEventListener('click', () => {
					openModal(item.dataset.src, item.dataset.type, item.dataset.title);
				});
			});

			document.getElementById('modalClose').addEventListener('click', () => modal.close());

			// showModal() handles Esc and focus trapping; clearing up happens here.
			modal.addEventListener('close', () => {
				modalBody.replaceChildren();
				document.body.style.overflow = '';
			});

			// Light-dismiss fallback for browsers without <dialog closedby> (Safari).
			if (!('closedBy' in HTMLDialogElement.prototype)) {
				modal.addEventListener('click', (event) => {
					if (event.target !== modal) return;
					const rect = modal.getBoundingClientRect();
					const insideContent =
						rect.top <= event.clientY && event.clientY <= rect.top + rect.height &&
						rect.left <= event.clientX && event.clientX <= rect.left + rect.width;
					if (insideContent) return;
					modal.close();
				});
				// The dialog fills the viewport here, so also treat a click on the
				// empty area of the flex wrapper as a backdrop click.
				modalBody.addEventListener('click', (event) => {
					if (event.target === modalBody) modal.close();
				});
			}
		</script>
		<script>
			// Theme toggle logic
			const themeToggle = document.getElementById('theme-toggle');
			if (themeToggle) {
				// Update icon based on current theme
				const updateIcon = () => {
					if (document.documentElement.getAttribute('data-theme') === 'dark') {
						themeToggle.classList.remove('fa-moon');
						themeToggle.classList.add('fa-sun');
					} else {
						themeToggle.classList.remove('fa-sun');
						themeToggle.classList.add('fa-moon');
					}
				};
				updateIcon();

				const toggleTheme = () => {
					const currentTheme = document.documentElement.getAttribute('data-theme');
					const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
					document.documentElement.setAttribute('data-theme', newTheme);
					localStorage.setItem('theme', newTheme);
					updateIcon();
				};

				themeToggle.addEventListener('click', toggleTheme);
				themeToggle.addEventListener('keydown', (e) => {
					if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
				});
			}
		</script>
